<agent_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/home/MRs/test.log</location>
  </localfile>

  <!-- Apache access logs (Debian/Ubuntu and wildcard rotation) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache2/*access*.log</location>
  </localfile>

  <!-- Apache access logs (RHEL/CentOS) -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/httpd/access_log</location>
  </localfile>

  <!-- Nginx access logs -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/access.log</location>
  </localfile>

  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/nginx/*access*.log</location>
  </localfile>
  <syscheck>
    <disabled>no</disabled>
    <directories realtime="yes">/var/www/html/DVWA/vulnerabilities/exec</directories>
    <alert_new_files>yes</alert_new_files>
    <scan_on_start>yes</scan_on_start>
  </syscheck>
</agent_config>
